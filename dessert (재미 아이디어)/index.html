<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Dessert Room Builder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #F8B3B3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
      transition: background-color 0.4s ease;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      color: #2D2D2D;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #444;
    }

    .guide-text {
      margin: 12px 0 8px;
      font-weight: bold;
      font-size: 1.05rem;
      color: #222;
    }

    .card-container {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      flex: 1;
      min-width: 250px;
      background: rgba(255, 255, 255, 0.9);
      border: 3px solid transparent;
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card.active {
      border-color: #222;
      background: #FFFFFF;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }

    .card .icon {
      font-size: 2.2rem;
      margin-bottom: 6px;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #222;
    }

    .card p {
      font-size: 0.82rem;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .color-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15);
    }

    /* 3D 캔버스 영역 */
    #canvas-container {
      width: 100%;
      max-width: 900px;
      height: 500px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      position: relative;
      background-color: #CCFBFA;
      transition: background-color 0.4s ease;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .control-panel {
      width: 100%;
      max-width: 900px;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #FFFFFF;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }

    .btn.active {
      background: #222;
      color: #FFF;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍰 3D Dessert Room Builder</h1>
    <p class="subtitle">귀여운 대표 디저트를 선택해 C4D 아이소매트릭 룸을 확인해보세요!</p>
    <div class="guide-text">👇 아래 디저트를 클릭하여 컨셉별 꾸며진 방을 확인하세요</div>
  </header>

  <div class="card-container">
    <div class="card active" onclick="switchTheme(0)">
      <div class="icon">🎂</div>
      <h3>사랑스러운 방 (딸기 케이크)</h3>
      <p>파스텔 핑크와 청량한 아쿠아 블루의 사랑스러운 조합</p>
      <div class="color-dots">
        <div class="dot" style="background:#F29191"></div>
        <div class="dot" style="background:#F7ADAD"></div>
        <div class="dot" style="background:#B1E5E6"></div>
        <div class="dot" style="background:#CCFBFA"></div>
      </div>
    </div>

    <div class="card" onclick="switchTheme(1)">
      <div class="icon">🧁</div>
      <h3>바다같은 방 (블루베리 컵케이크)</h3>
      <p>깊은 바다색과 따뜻한 아이보리가 어우러진 휴식 공간</p>
      <div class="color-dots">
        <div class="dot" style="background:#3368A0"></div>
        <div class="dot" style="background:#66A3BF"></div>
        <div class="dot" style="background:#C8DFDB"></div>
        <div class="dot" style="background:#F2EFE7"></div>
      </div>
    </div>

    <div class="card" onclick="switchTheme(2)">
      <div class="icon">🔮</div>
      <h3>화려한 네온 방 (초코 몽블랑)</h3>
      <p>블랙 바탕에 퍼플 & 핫핑크 네온이 빛나는 트렌디 공간</p>
      <div class="color-dots">
        <div class="dot" style="background:#000000"></div>
        <div class="dot" style="background:#9929EA"></div>
        <div class="dot" style="background:#FF5FCF"></div>
        <div class="dot" style="background:#FAEB92"></div>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="roomCanvas"></canvas>
  </div>

  <div class="control-panel">
    <div style="font-weight: bold;">🏠 3D 오브젝트 선택</div>
    <div class="btn-group">
      <button class="btn active" onclick="setFocus('room')">🏠 전체 아이소매트릭 룸</button>
      <button class="btn" onclick="setFocus('dessert')">🍰 미니 디저트 케이크 Focus</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('roomCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let currentTheme = 0;
    let currentFocus = 'room';
    let angle = 0;

    const themes = [
      {
        bg: '#CCFBFA',
        wallLeft: '#F29191',
        wallRight: '#F7ADAD',
        floor: '#B1E5E6',
        bed: '#F29191',
        sheet: '#CCFBFA',
        desk: '#FFFFFF',
        cakeBase: '#F7ADAD',
        cakeCream: '#FFFFFF',
        cakeTop: '#F29191',
        windowBg: '#CCFBFA'
      },
      {
        bg: '#F2EFE7',
        wallLeft: '#3368A0',
        wallRight: '#66A3BF',
        floor: '#C8DFDB',
        bed: '#3368A0',
        sheet: '#F2EFE7',
        desk: '#F2EFE7',
        cakeBase: '#66A3BF',
        cakeCream: '#3368A0',
        cakeTop: '#C8DFDB',
        windowBg: '#EBF3F8'
      },
      {
        bg: '#000000',
        wallLeft: '#2D0A4E',
        wallRight: '#4A1282',
        floor: '#150524',
        bed: '#9929EA',
        sheet: '#FF5FCF',
        desk: '#3A0066',
        cakeBase: '#FF5FCF',
        cakeCream: '#FAEB92',
        cakeTop: '#9929EA',
        windowBg: '#FAEB92'
      }
    ];

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    function drawIsoBox(cx, cy, w, h, d, colorTop, colorLeft, colorRight) {
      ctx.fillStyle = colorTop;
      ctx.beginPath();
      ctx.moveTo(cx, cy - h);
      ctx.lineTo(cx + w, cy - h - w * 0.5);
      ctx.lineTo(cx, cy - h - w);
      ctx.lineTo(cx - w, cy - h - w * 0.5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = colorLeft;
      ctx.beginPath();
      ctx.moveTo(cx - w, cy - h - w * 0.5);
      ctx.lineTo(cx, cy - h);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx - w, cy - w * 0.5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = colorRight;
      ctx.beginPath();
      ctx.moveTo(cx, cy - h);
      ctx.lineTo(cx + w, cy - h - w * 0.5);
      ctx.lineTo(cx + w, cy - w * 0.5);
      ctx.lineTo(cx, cy);
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      const t = themes[currentTheme];

      container.style.backgroundColor = t.bg;
      ctx.clearRect(0, 0, w, h);

      let cx = w / 2;
      let cy = currentFocus === 'room' ? h / 2 + 30 : h / 2 + 120;
      let scale = currentFocus === 'room' ? 0.85 : 1.5;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);

      // 1. 바닥
      drawIsoBox(0, 0, 160, 18, 160, t.floor, t.wallLeft, t.wallRight);

      // 2. 왼쪽 벽
      ctx.fillStyle = t.wallLeft;
      ctx.beginPath();
      ctx.moveTo(-160, -9);
      ctx.lineTo(0, 71);
      ctx.lineTo(0, -160);
      ctx.lineTo(-160, -240);
      ctx.closePath();
      ctx.fill();

      // 3. 오른쪽 벽
      ctx.fillStyle = t.wallRight;
      ctx.beginPath();
      ctx.moveTo(0, 71);
      ctx.lineTo(160, -9);
      ctx.lineTo(160, -240);
      ctx.lineTo(0, -160);
      ctx.closePath();
      ctx.fill();

      // 4. 창문
      ctx.fillStyle = t.windowBg;
      ctx.beginPath();
      ctx.moveTo(50, -90);
      ctx.lineTo(120, -125);
      ctx.lineTo(120, -185);
      ctx.lineTo(50, -150);
      ctx.closePath();
      ctx.fill();

      // 5. 침대
      drawIsoBox(-80, -10, 50, 20, 80, t.bed, t.sheet, t.wallLeft);
      drawIsoBox(-100, -30, 35, 12, 25, t.sheet, t.bed, t.sheet);

      // 6. 책상
      drawIsoBox(70, -20, 45, 35, 45, t.desk, t.wallRight, t.floor);

      // 7. 케이크 (책상 위 3D 디저트)
      let cakeY = -60 + Math.sin(angle) * 3;
      drawIsoBox(70, cakeY, 18, 12, 18, t.cakeBase, t.cakeCream, t.cakeTop);
      drawIsoBox(70, cakeY - 12, 10, 8, 10, t.cakeCream, t.cakeTop, t.cakeBase);
      drawIsoBox(70, cakeY - 20, 4, 4, 4, t.cakeTop, t.cakeBase, t.cakeCream);

      ctx.restore();

      angle += 0.05;
      requestAnimationFrame(draw);
    }

    function switchTheme(index) {
      currentTheme = index;
      document.querySelectorAll('.card').forEach((card, idx) => {
        card.classList.toggle('active', idx === index);
      });
    }

    function setFocus(type) {
      currentFocus = type;
      const btns = document.querySelectorAll('.btn');
      btns[0].classList.toggle('active', type === 'room');
      btns[1].classList.toggle('active', type === 'dessert');
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    draw();
  </script>
</body>
</html>
